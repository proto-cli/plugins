[package]
name = "mc-server"
version = "0.1.0"
edition = "2021"
description = "Minecraft server management plugin for proto CLI"

[[bin]]
name = "mc-server"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
indicatif = "0.17"
dialoguer = "0.11"
sysinfo = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
