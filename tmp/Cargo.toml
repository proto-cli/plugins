[package]
name = "tmp"
version = "0.1.0"
edition = "2021"
description = "Ephemeral sandboxed environments for proto"

[[bin]]
name = "proto-tmp"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
libc = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
