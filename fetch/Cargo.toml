[package]
name = "fetch"
version = "0.2.0"
edition = "2021"
description = "neofetch-style system information — ASCII logo, hardware, disks, JSONC config"
license = "MIT"

[[bin]]
name = "fetch"
path = "src/main.rs"

[dependencies]
owo-colors = "4"
sysinfo = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"