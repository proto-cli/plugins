name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Find and build plugin binaries
        shell: bash
        run: |
          mkdir -p release
          for dir in */; do
            if [ -f "$dir/Cargo.toml" ] && [ "$dir" != "shared/" ] && [ "$dir" != "template/" ]; then
              name=$(basename "$dir")
              echo "Building $name..."
              if cargo build --release --target ${{ matrix.target }} --manifest-path "$dir/Cargo.toml" 2>/dev/null; then
                # Prefer explicit [[bin]] names (e.g. convert builds "proto-convert"),
                # falling back to the package/dir name when no [[bin]] section exists.
                bin_names=($(awk '/^\[\[bin\]\]/ || /^\[bin\]/ {want=1; next}
                                  /^\[/ {want=0}
                                  want && /^name[[:space:]]*=[[:space:]]*"/ {sub(/^name[[:space:]]*=[[:space:]]*"/, ""); sub(/".*/, ""); print; want=0}' "$dir/Cargo.toml"))
                if [ ${#bin_names[@]} -eq 0 ]; then
                  bin_names=("$name")
                fi
                ext=""
                if [[ "${{ matrix.target }}" == *"windows"* ]]; then
                  ext=".exe"
                fi
                for bin_name in "${bin_names[@]}"; do
                  binary="target/${{ matrix.target }}/release/${bin_name}${ext}"
                  if [ -f "$binary" ]; then
                    cp "$binary" "release/${bin_name}-${{ matrix.target }}${ext}"
                    echo "  -> ${bin_name}"
                  else
                    echo "  -> MISSING $(basename "$binary")"
                  fi
                done
              else
                echo "  -> FAILED (skipped)"
              fi
            fi
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
