name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Find and build plugin binaries
        shell: bash
        run: |
          mkdir -p release
          for dir in */; do
            if [ -f "$dir/Cargo.toml" ] && [ "$dir" != "shared/" ] && [ "$dir" != "template/" ]; then
              name=$(basename "$dir")
              echo "Building $name..."
              if cargo build --release --target ${{ matrix.target }} --manifest-path "$dir/Cargo.toml" 2>/dev/null; then
                # Find the binary
                bin_name=$(grep -oP 'name\s*=\s*"\K[^"]+' "$dir/Cargo.toml" | head -1)
                if [ -z "$bin_name" ]; then
                  bin_name="$name"
                fi
                ext=""
                if [[ "${{ matrix.target }}" == *"windows"* ]]; then
                  ext=".exe"
                fi
                binary="target/${{ matrix.target }}/release/${bin_name}${ext}"
                if [ -f "$binary" ]; then
                  cp "$binary" "release/${bin_name}-${{ matrix.target }}${ext}"
                  echo "  -> ${bin_name}"
                fi
              else
                echo "  -> FAILED (skipped)"
              fi
            fi
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
