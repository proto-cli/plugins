[package]
name = "mc"
version = "0.2.0"
edition = "2021"
description = "Minecraft resource packs & server management plugin for proto CLI"

[[bin]]
name = "mc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = "2"
flate2 = "1"
crc32fast = "1"
indicatif = "0.17"
sysinfo = "0.31"
