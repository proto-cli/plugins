[package]
name = "encrypt"
version = "0.1.0"
edition = "2021"

[dependencies]
proto-plugin-sdk = { path = "../shared" }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
bcrypt = "0.16"
