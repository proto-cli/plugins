[package]
name = "venv"
version = "0.1.0"
edition = "2021"
description = "Python virtualenv manager — create/enter/resume projects with one command"
license = "MIT"

[[bin]]
name = "venv"
path = "src/main.rs"

[dependencies]
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"